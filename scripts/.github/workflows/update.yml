name: Update stock data
on:
  schedule:
    - cron: "0 12 * * 6"   # every Saturday at 12:00 UTC
  workflow_dispatch:        # lets you run it by hand
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch data
        run: node scripts/update.js
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      - name: Save data to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/stocks.json
          git diff --staged --quiet || git commit -m "Weekly data update"
          git push
